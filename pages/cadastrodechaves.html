<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de chaves</title>
    <link rel="stylesheet" href="../css/menu-lateral.css">
    <link rel="stylesheet" href="../css/cadastrodechaves.css">
</head>
<body>
    <div id="menu-lateral-container" data-page="cadastro-chaves" data-menu-url="menu-lateral.html"></div>

    <main>
        <section class="cadastro-chaves">
            <h1>Cadastro de chaves</h1>

            <form class="form-cadastro-chaves">
                <div class="campo-formulario">
                    <label for="nome-sala">Nome da sala</label>
                    <input type="text" id="nome-sala" name="nome-sala" placeholder="Digite o nome da sala">
                </div>

                <div class="campo-formulario">
                    <label for="numero-chave">Número</label>
                    <input type="text" id="numero-chave" name="numero-chave" placeholder="Ex.: 12">
                </div>
            </form>
        </section>
    </main>

    <script src="../js/menu-lateral.js" defer></script>
</body>
</html>
