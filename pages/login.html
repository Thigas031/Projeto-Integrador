<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de gerenciamento de chaves - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="logo-principal">
                <img src="../assets/icons/Logo%20sistema%20de%20chaves.svg" alt="Sistema de gerenciamento de chaves">
            </div>
            <h1>
                Sistema de
                <span>Gerenciamento de<br>Chaves</span>
            </h1>
            <section class="login-session" id="login-session" aria-live="polite" hidden>
                <p id="login-session-message"></p>
                <button type="button" id="login-logout">Sair da conta</button>
            </section>
            <form class="login-form" id="login-form" action="../controllers/controller_user_login.php" method="post" novalidate>
                <p id="login-feedback" class="login-feedback" role="status" aria-live="polite"></p>
                <div class="input-group">
                    <label for="identificador">CPF</label>
                    <input
                        type="text"
                        id="identificador"
                        name="cpf"
                        autocomplete="username"
                        placeholder="Digite seu CPF"
                        inputmode="numeric"
                        maxlength="11"
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>
                </div>
                <div class="login-options">
                    <label class="remember" for="lembrar">
                        <input type="checkbox" id="lembrar" name="lembrar" value="1">
                        <span class="checkbox" aria-hidden="true"></span>
                        Lembrar de mim por 7 dias
                    </label>
                </div>
                <button type="submit">
                    Entrar
                </button>
            </form>
            <div class="logo-footer">
                <img src="../assets/icons/80anos_oficial.svg" alt="SENAC e 80 anos">
            </div>
        </section>
    </main>
    <script src="../js/app-profile.js?v=staff-access-1"></script>
    <script src="../js/app-services.js?v=staff-access-1"></script>
    <script src="../js/form-feedback.js"></script>
    <script src="../js/login.js?v=staff-access-1"></script>
</body>
</html>
