<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de gerenciamento de chaves - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="logo-principal">
                <img src="../assets/icons/Logo%20sistema%20de%20chaves.svg" alt="Sistema de gerenciamento de chaves">
            </div>
            <h1>
                Sistema de
                <span>Gerenciamento de<br>Chaves</span>
            </h1>
             <form class="login-form" action="../pages/dashboard.html" method="get">
                <div class="input-group">
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite a senha do seu usuário"
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>
                </div>
                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox">
                        <span class="checkbox"></span>
                        <span>Lembrar de mim</span>
                    </label>
                </div>
                <button type="submit">
                    Entrar
                </button>
            </form>
            <div class="logo-footer">
                <img src="../assets/icons/80anos_oficial.svg" alt="SENAC e 80 anos">
            </div>
        </section>
    </main>
</body>
</html>
