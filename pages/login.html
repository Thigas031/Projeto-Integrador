<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de gerenciamento de chaves - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="logo-principal">
                <img src="../assets/icons/Logo%20sistema%20de%20chaves.svg" alt="Sistema de gerenciamento de chaves">
            </div>
            <h1>
                Sistema de
                <span>Gerenciamento de<br>Chaves</span>
            </h1>
            <section class="login-session" id="login-session" aria-live="polite" hidden>
                <p id="login-session-message"></p>
                <button type="button" id="login-logout">Sair da conta</button>
            </section>
            <form class="login-form" id="login-form" novalidate>
                <p id="login-feedback" class="login-feedback" role="status" aria-live="polite"></p>
                <div class="input-group">
                    <label for="identificador">CPF ou e-mail</label>
                    <input
                        type="text"
                        id="identificador"
                        name="identificador"
                        autocomplete="username"
                        placeholder="Digite seu CPF ou e-mail"
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>
                </div>
                <button type="submit">
                    Entrar
                </button>
            </form>
            <div class="logo-footer">
                <img src="../assets/icons/80anos_oficial.svg" alt="SENAC e 80 anos">
            </div>
        </section>
    </main>
    <script src="../js/app-profile.js"></script>
    <script src="../js/app-services.js"></script>
    <script src="../js/form-feedback.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
